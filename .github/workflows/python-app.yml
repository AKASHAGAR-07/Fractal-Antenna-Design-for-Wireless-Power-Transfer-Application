# GitHub Actions CI Workflow for Python Tools
name: Python Application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib flake8 black

    - name: Lint with flake8 & black
      run: |
        # check syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # black formatting check (warn only, exit status 0 for demonstration)
        black --check . || true

    - name: Test Antenna Calculator script
      run: |
        # Run calculator with default values and verify exit status
        python src/antenna_calculator.py
        # Run calculator with custom arguments (Frequency=5.8 GHz, Permittivity=4.4, Height=1.575)
        python src/antenna_calculator.py 5.8 4.4 1.575

    - name: Test Plotting utility
      run: |
        # Run plotting script and verify it writes PNGs
        python src/plot_results.py
        # Verify images are successfully written to docs/img/
        ls -la docs/img/
        test -f docs/img/s11_plot.png
        test -f docs/img/vswr_plot.png
        test -f docs/img/e_plane_pattern.png
        test -f docs/img/h_plane_pattern.png
